name: Windows
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - .gitignore
      - 'CITATION.cff'
    branches:
      - develop
      - master
      - rc**
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test windows
    runs-on: 'windows-latest'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache NEURON installation
        id: cache-neuron
        uses: actions/cache@v4
        with:
          path: nrn_installer_8.0.exe
          key: nrn_installer_8.0

      - name: Download NEURON
        if: steps.cache-neuron.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo ------------ Downloading NEURON installer -------------
          curl https://neuron.yale.edu/ftp/neuron/versions/v8.0/nrn-8.0.w64-mingwsetup.exe -o nrn_installer_8.0.exe

      - name: Install NEURON
        shell: cmd
        run: |
          echo ------------ Installing NEURON -------------
          start /b /wait .\nrn_installer_8.0.exe /S /D=C:\nrn

      - name: Install & setup environment
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.47.0
          cache: true
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}
          manifest-path: pyproject.toml
          post-cleanup: true
          pixi-bin-path: ${{ runner.temp }}\Scripts\pixi.exe

      - name: Cache barrel cortex model
        id: cache-bc-model
        uses: actions/cache@v4
        with:
          path: barrel_cortex/
          key: barrel-cortex-model

      - name: Download barrel cortex model
        if: steps.cache-bc-model.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo ------------ Downloading barrel cortex model -------------
          pixi r download_bc_model

      - name: Preliminary setup
        shell: cmd
        env:
            NEURONHOME: C:\nrn
        run: |
          echo ------------ Preliminary setup for tests -------------
          echo Creating tests\logs\ directory...
          if exist tests\logs rmdir /s /q tests\logs
          mkdir tests\logs

          if not exist "%USERPROFILE%\tmp" mkdir "%USERPROFILE%\tmp"
          set TMPDIR=%USERPROFILE%\tmp
          
          pixi r configure

      - name: Test ISF
        shell: cmd
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEURONHOME: C:\nrn
          MPLBACKEND: Agg
          DASK_CONFIG: tests/dask_config.yml
        run: |
          echo --------------- env vars ----------------
          echo NEURONHOME: %NEURONHOME%
          echo MPLBACKEND: %MPLBACKEND%

          echo ------------ Running tests -------------
          pixi r pytest -n 3 --dist worksteal -rsx -vv  --color=yes --durations=0 --cov-report xml:tests\logs\report_py38.xml --cov=. tests

      - name: Save test logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ github.run_id }}_logs
          path: ./tests/logs/
